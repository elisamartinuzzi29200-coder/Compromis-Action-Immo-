<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Compromis Action Immo</title>
  <link rel="stylesheet" href="./styles.css?v=cloud-1">
  <link rel="stylesheet" href="./document-import-v2.css">
  <link rel="stylesheet" href="./notary-directory.css">
</head>
<body class="cloud-locked">
<div id="cloudGate" class="cloudGate">
  <form id="cloudLoginForm" class="cloudLoginCard">
    <h2>Vos compromis, sur tous vos ordinateurs</h2>
    <p>Connectez-vous avec votre compte Action Immobilière pour retrouver vos dossiers et reprendre votre rédaction.</p>
    <label>Adresse e-mail<input id="cloudEmail" type="email" autocomplete="username" required></label>
    <label>Mot de passe<input id="cloudPassword" type="password" autocomplete="current-password" required></label>
    <button type="submit" class="primary">Se connecter</button>
    <p id="cloudLoginMessage" class="cloudLoginMessage"></p>
  </form>
</div>
<header>
  <div>
    <h1>COMPROMIS DE VENTE</h1>
    <p>Action Immobilière — remplissage du modèle Word officiel</p>
  </div>
  <div class="actions">
    <span id="cloudStatus" class="cloudStatus"></span><span id="status"></span>
    <button id="templateBtn">Charger le modèle Word</button>
    <button id="dashboardBtn">Mes dossiers</button><button id="newBtn">Nouveau dossier</button>
    <button id="saveBtn">Sauvegarder</button>
    <button id="sruBtn">Notification SRU</button>
    <button id="generateBtn" class="primary">Générer le Word</button>
    <input id="templateInput" type="file" accept=".docx" hidden>
    <input id="documentImportInput" type="file" accept=".pdf,.jpg,.jpeg,.png,.webp,application/pdf,image/*" multiple hidden>
  </div>
</header>
<div class="app">
  <aside id="nav"></aside>
  <main>
    <section id="content"></section>
    <footer>
      <button id="prev">Précédent</button>
      <button id="next">Suivant</button>
    </footer>
  </main>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script>
<script>if(window.pdfjsLib)pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="./compromis-cloud.js?v=1"></script>
<script src="./docx-fill.js"></script>
<script src="./app.js?v=cloud-2"></script>
<script src="./document-import-v2.js"></script>
<script src="./notary-directory.js"></script>
</body>
</html>
